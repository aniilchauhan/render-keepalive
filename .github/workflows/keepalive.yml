name: Keep Render server awake

# Render's free tier spins the server down after 15 minutes without traffic,
# and waking it up takes about 50 seconds. A ping every 10 minutes keeps it warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  HEALTH_URL: https://our-little-world-2dx6.onrender.com/health

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$HEALTH_URL")
          echo "health returned HTTP $code"
          test "$code" = "200"
